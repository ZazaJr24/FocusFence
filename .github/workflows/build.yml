name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build and run headless core checks
        shell: pwsh
        run: .\build.ps1 -CoreTest
      - name: Create portable package
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist-net10\* -DestinationPath .\FocusFence-Portable.zip
          $hash = (Get-FileHash .\FocusFence-Portable.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FocusFence-Portable.zip" | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FocusFence-Windows-x64-net10
          path: |
            FocusFence-Portable.zip
            SHA256SUMS.txt
            core-test-results.txt
          if-no-files-found: error
          retention-days: 14
